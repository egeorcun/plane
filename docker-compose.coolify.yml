# =============================================================================
# PLANE DOCKER COMPOSE FOR COOLIFY (Pre-built Images from GHCR)
# =============================================================================
# This file uses pre-built images from GitHub Container Registry.
# Compatible with Coolify's SERVICE_* auto-generated variables.
# =============================================================================

x-db-env: &db-env
  PGHOST: plane-db
  PGDATABASE: plane
  POSTGRES_USER: $SERVICE_USER_POSTGRES
  POSTGRES_PASSWORD: $SERVICE_PASSWORD_POSTGRES
  POSTGRES_DB: plane
  POSTGRES_PORT: 5432
  PGDATA: /var/lib/postgresql/data

x-redis-env: &redis-env
  REDIS_HOST: '${REDIS_HOST:-plane-redis}'
  REDIS_PORT: '${REDIS_PORT:-6379}'
  REDIS_URL: '${REDIS_URL:-redis://plane-redis:6379/}'

x-minio-env: &minio-env
  MINIO_ROOT_USER: $SERVICE_USER_MINIO
  MINIO_ROOT_PASSWORD: $SERVICE_PASSWORD_MINIO

x-aws-s3-env: &aws-s3-env
  AWS_REGION: '${AWS_REGION:-}'
  AWS_ACCESS_KEY_ID: $SERVICE_USER_MINIO
  AWS_SECRET_ACCESS_KEY: $SERVICE_PASSWORD_MINIO
  AWS_S3_ENDPOINT_URL: '${AWS_S3_ENDPOINT_URL:-http://plane-minio:9000}'
  AWS_S3_BUCKET_NAME: '${AWS_S3_BUCKET_NAME:-uploads}'

x-mq-env: &mq-env
  RABBITMQ_HOST: plane-mq
  RABBITMQ_PORT: '${RABBITMQ_PORT:-5672}'
  RABBITMQ_DEFAULT_USER: $SERVICE_USER_RABBITMQ
  RABBITMQ_DEFAULT_PASS: $SERVICE_PASSWORD_RABBITMQ
  RABBITMQ_DEFAULT_VHOST: '${RABBITMQ_VHOST:-plane}'
  RABBITMQ_VHOST: '${RABBITMQ_VHOST:-plane}'

x-live-env: &live-env
  API_BASE_URL: '${API_BASE_URL:-http://api:8000}'
  LIVE_SERVER_SECRET_KEY: $SERVICE_PASSWORD_64_SECRETKEY

x-app-env: &app-env
  APP_RELEASE: '${APP_RELEASE:-latest}'
  # WEB_URL and CORS need full URL with scheme - use SERVICE_URL_PLANE which has http://
  WEB_URL: '${WEB_URL:-${SERVICE_URL_PLANE:-http://localhost}}'
  DEBUG: '${DEBUG:-0}'
  # CORS: User should set this manually in Coolify env, e.g., https://plane.software.vision
  CORS_ALLOWED_ORIGINS: '${CORS_ALLOWED_ORIGINS:-http://localhost}'
  GUNICORN_WORKERS: '${GUNICORN_WORKERS:-2}'
  USE_MINIO: '${USE_MINIO:-1}'
  DATABASE_URL: 'postgresql://$SERVICE_USER_POSTGRES:$SERVICE_PASSWORD_POSTGRES@plane-db/plane'
  SECRET_KEY: $SERVICE_PASSWORD_64_SECRETKEY
  AMQP_URL: 'amqp://$SERVICE_USER_RABBITMQ:$SERVICE_PASSWORD_RABBITMQ@plane-mq:${RABBITMQ_PORT:-5672}/plane'
  API_KEY_RATE_LIMIT: '${API_KEY_RATE_LIMIT:-60/minute}'
  MINIO_ENDPOINT_SSL: '${MINIO_ENDPOINT_SSL:-0}'
  # Security: Skip validation for Coolify deployment (Coolify manages secrets)
  SKIP_SECURITY_VALIDATION: '1'

# =============================================================================
# SERVICES - Using pre-built images from GitHub Container Registry
# =============================================================================

services:
  proxy:
    image: 'ghcr.io/egeorcun/plane-proxy:${APP_RELEASE:-latest}'
    environment:
      - 'APP_DOMAIN=${WEB_URL:-${SERVICE_URL_PLANE:-http://localhost}}'
      - 'SITE_ADDRESS=:80'
      - 'FILE_SIZE_LIMIT=${FILE_SIZE_LIMIT:-5242880}'
      - 'BUCKET_NAME=${AWS_S3_BUCKET_NAME:-uploads}'
    depends_on:
      - web
      - api
      - space
      - admin
      - live
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:80/']
      interval: 5s
      timeout: 10s
      retries: 15

  web:
    image: 'ghcr.io/egeorcun/plane-web:${APP_RELEASE:-latest}'
    depends_on:
      - api
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/ || exit 0']
      interval: 5s
      timeout: 10s
      retries: 15

  space:
    image: 'ghcr.io/egeorcun/plane-space:${APP_RELEASE:-latest}'
    depends_on:
      - api
      - web
    healthcheck:
      test: ['CMD', 'echo', 'ok']
      interval: 5s
      timeout: 10s
      retries: 15

  admin:
    image: 'ghcr.io/egeorcun/plane-admin:${APP_RELEASE:-latest}'
    depends_on:
      - api
      - web
    healthcheck:
      test: ['CMD', 'echo', 'ok']
      interval: 5s
      timeout: 10s
      retries: 15

  live:
    image: 'ghcr.io/egeorcun/plane-live:${APP_RELEASE:-latest}'
    environment:
      <<: [*live-env, *redis-env]
    depends_on:
      - api
      - web
      - plane-redis
    healthcheck:
      test: ['CMD', 'echo', 'ok']
      interval: 5s
      timeout: 10s
      retries: 15

  api:
    image: 'ghcr.io/egeorcun/plane-backend:${APP_RELEASE:-latest}'
    command: ./bin/docker-entrypoint-api.sh
    volumes:
      - logs_api:/code/plane/logs
    environment:
      <<: [*app-env, *db-env, *redis-env, *aws-s3-env, *mq-env]
    depends_on:
      - plane-db
      - plane-redis
      - plane-mq
    healthcheck:
      test: ['CMD', 'echo', 'ok']
      interval: 5s
      timeout: 10s
      retries: 15

  worker:
    image: 'ghcr.io/egeorcun/plane-backend:${APP_RELEASE:-latest}'
    command: ./bin/docker-entrypoint-worker.sh
    volumes:
      - logs_worker:/code/plane/logs
    environment:
      <<: [*app-env, *db-env, *redis-env, *aws-s3-env, *mq-env]
    depends_on:
      - api
      - plane-db
      - plane-redis
      - plane-mq
    healthcheck:
      test: ['CMD', 'echo', 'ok']
      interval: 5s
      timeout: 10s
      retries: 15

  beat-worker:
    image: 'ghcr.io/egeorcun/plane-backend:${APP_RELEASE:-latest}'
    command: ./bin/docker-entrypoint-beat.sh
    volumes:
      - logs_beat:/code/plane/logs
    environment:
      <<: [*app-env, *db-env, *redis-env, *aws-s3-env, *mq-env]
    depends_on:
      - api
      - plane-db
      - plane-redis
      - plane-mq
    healthcheck:
      test: ['CMD', 'echo', 'ok']
      interval: 5s
      timeout: 10s
      retries: 15

  migrator:
    image: 'ghcr.io/egeorcun/plane-backend:${APP_RELEASE:-latest}'
    restart: 'no'
    command: ./bin/docker-entrypoint-migrator.sh
    volumes:
      - logs_migrator:/code/plane/logs
    environment:
      <<: [*app-env, *db-env, *redis-env, *aws-s3-env, *mq-env]
    depends_on:
      - plane-db
      - plane-redis

  plane-db:
    image: postgres:15.7-alpine
    command: postgres -c 'max_connections=1000'
    environment:
      <<: *db-env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 20s
      retries: 10

  plane-redis:
    image: valkey/valkey:7.2.5-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 20s
      retries: 10

  plane-mq:
    image: rabbitmq:3.13.6-management-alpine
    restart: always
    environment:
      <<: *mq-env
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: 'rabbitmq-diagnostics -q ping'
      interval: 30s
      timeout: 30s
      retries: 3

  plane-minio:
    image: minio/minio:latest
    command: server /export --console-address ":9090"
    environment:
      <<: *minio-env
    volumes:
      - uploads:/export
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 20s
      retries: 10

volumes:
  pgdata:
  redisdata:
  uploads:
  rabbitmq_data:
  logs_api:
  logs_worker:
  logs_beat:
  logs_migrator:
