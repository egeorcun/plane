# =============================================================================
# PLANE DOCKER COMPOSE FOR COOLIFY (Pre-built Images)
# =============================================================================
# This file uses pre-built images from GitHub Container Registry.
# Images are built automatically by GitHub Actions on every push.
#
# USAGE IN COOLIFY:
#   1. Add this repo in Coolify
#   2. Select docker-compose.coolify.yml
#   3. Set "Domains for proxy" to your domain
#   4. Deploy - no build needed, just pulls images!
#
# Environment variables are auto-generated by Coolify's SERVICE_* variables.
# =============================================================================

x-db-env: &db-env
  PGHOST: plane-db
  PGDATABASE: ${POSTGRES_DB:-plane}
  POSTGRES_USER: ${SERVICE_USER_POSTGRES:-${POSTGRES_USER:-plane}}
  POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES:-${POSTGRES_PASSWORD:-plane}}
  POSTGRES_DB: ${POSTGRES_DB:-plane}
  POSTGRES_PORT: "5432"
  PGDATA: /var/lib/postgresql/data

x-redis-env: &redis-env
  REDIS_HOST: ${REDIS_HOST:-plane-redis}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_URL: ${REDIS_URL:-redis://plane-redis:6379/}

x-minio-env: &minio-env
  MINIO_ROOT_USER: ${SERVICE_USER_MINIO:-${AWS_ACCESS_KEY_ID:-minioadmin}}
  MINIO_ROOT_PASSWORD: ${SERVICE_PASSWORD_MINIO:-${AWS_SECRET_ACCESS_KEY:-minioadmin}}

x-aws-s3-env: &aws-s3-env
  AWS_REGION: ${AWS_REGION:-}
  AWS_ACCESS_KEY_ID: ${SERVICE_USER_MINIO:-${AWS_ACCESS_KEY_ID:-minioadmin}}
  AWS_SECRET_ACCESS_KEY: ${SERVICE_PASSWORD_MINIO:-${AWS_SECRET_ACCESS_KEY:-minioadmin}}
  AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-http://plane-minio:9000}
  AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}

x-mq-env: &mq-env
  RABBITMQ_HOST: plane-mq
  RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
  RABBITMQ_DEFAULT_USER: ${SERVICE_USER_RABBITMQ:-${RABBITMQ_USER:-plane}}
  RABBITMQ_DEFAULT_PASS: ${SERVICE_PASSWORD_RABBITMQ:-${RABBITMQ_PASSWORD:-plane}}
  RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-plane}
  RABBITMQ_VHOST: ${RABBITMQ_VHOST:-plane}

x-live-env: &live-env
  API_BASE_URL: ${API_BASE_URL:-http://api:8000}

x-app-env: &app-env
  APP_RELEASE: ${APP_RELEASE:-latest}
  WEB_URL: ${SERVICE_URL_PLANE:-${WEB_URL:-http://localhost}}
  GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
  USE_MINIO: ${USE_MINIO:-1}
  SECRET_KEY: ${SERVICE_PASSWORD_64_SECRET:-${SECRET_KEY:-}}
  DEBUG: ${DEBUG:-0}
  ALLOWED_HOSTS: ${SERVICE_FQDN_PLANE:-${ALLOWED_HOSTS:-localhost}}
  CORS_ALLOWED_ORIGINS: ${SERVICE_URL_PLANE:-${CORS_ALLOWED_ORIGINS:-http://localhost}}
  DATABASE_URL: postgresql://${SERVICE_USER_POSTGRES:-${POSTGRES_USER:-plane}}:${SERVICE_PASSWORD_POSTGRES:-${POSTGRES_PASSWORD:-plane}}@plane-db/${POSTGRES_DB:-plane}
  AMQP_URL: amqp://${SERVICE_USER_RABBITMQ:-${RABBITMQ_USER:-plane}}:${SERVICE_PASSWORD_RABBITMQ:-${RABBITMQ_PASSWORD:-plane}}@plane-mq:${RABBITMQ_PORT:-5672}/${RABBITMQ_VHOST:-plane}
  API_KEY_RATE_LIMIT: ${API_KEY_RATE_LIMIT:-60/minute}
  MINIO_ENDPOINT_SSL: ${MINIO_ENDPOINT_SSL:-0}

# =============================================================================
# SERVICES - Using pre-built images from GitHub Container Registry
# =============================================================================

services:
  proxy:
    image: ghcr.io/egeorcun/plane-proxy:${APP_RELEASE:-latest}
    container_name: plane-proxy
    restart: always
    ports:
      - "${LISTEN_HTTP_PORT:-80}:80"
    environment:
      FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}
      BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
    labels:
      - "coolify.managed=true"
      - "coolify.proxy=true"
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
      space:
        condition: service_healthy
      admin:
        condition: service_healthy
      live:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: ghcr.io/egeorcun/plane-web:${APP_RELEASE:-latest}
    container_name: plane-web
    restart: always
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5

  space:
    image: ghcr.io/egeorcun/plane-space:${APP_RELEASE:-latest}
    container_name: plane-space
    restart: always
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5

  admin:
    image: ghcr.io/egeorcun/plane-admin:${APP_RELEASE:-latest}
    container_name: plane-admin
    restart: always
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5

  live:
    image: ghcr.io/egeorcun/plane-live:${APP_RELEASE:-latest}
    container_name: plane-live
    restart: always
    environment:
      <<: [*live-env, *redis-env]
    depends_on:
      api:
        condition: service_healthy
      plane-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ghcr.io/egeorcun/plane-backend:${APP_RELEASE:-latest}
    container_name: plane-api
    restart: always
    command: ./bin/docker-entrypoint-api.sh
    volumes:
      - logs_api:/code/plane/logs
    environment:
      <<: [*app-env, *db-env, *redis-env, *aws-s3-env, *mq-env]
    depends_on:
      plane-db:
        condition: service_healthy
      plane-redis:
        condition: service_healthy
      plane-mq:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/')"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  worker:
    image: ghcr.io/egeorcun/plane-backend:${APP_RELEASE:-latest}
    container_name: plane-worker
    restart: always
    command: ./bin/docker-entrypoint-worker.sh
    volumes:
      - logs_worker:/code/plane/logs
    environment:
      <<: [*app-env, *db-env, *redis-env, *aws-s3-env, *mq-env]
    depends_on:
      api:
        condition: service_healthy

  beat-worker:
    image: ghcr.io/egeorcun/plane-backend:${APP_RELEASE:-latest}
    container_name: plane-beat
    restart: always
    command: ./bin/docker-entrypoint-beat.sh
    volumes:
      - logs_beat:/code/plane/logs
    environment:
      <<: [*app-env, *db-env, *redis-env, *aws-s3-env, *mq-env]
    depends_on:
      api:
        condition: service_healthy

  migrator:
    image: ghcr.io/egeorcun/plane-backend:${APP_RELEASE:-latest}
    container_name: plane-migrator
    restart: "no"
    command: ./bin/docker-entrypoint-migrator.sh
    volumes:
      - logs_migrator:/code/plane/logs
    environment:
      <<: [*app-env, *db-env, *redis-env, *aws-s3-env, *mq-env]
      SKIP_SECURITY_VALIDATION: "1"
    depends_on:
      plane-db:
        condition: service_healthy
      plane-redis:
        condition: service_healthy

  plane-db:
    image: postgres:15.7-alpine
    container_name: plane-db
    restart: always
    command: postgres -c 'max_connections=1000'
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      <<: *db-env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SERVICE_USER_POSTGRES:-${POSTGRES_USER:-plane}} -d ${POSTGRES_DB:-plane}"]
      interval: 5s
      timeout: 5s
      retries: 10

  plane-redis:
    image: valkey/valkey:7.2.5-alpine
    container_name: plane-redis
    restart: always
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  plane-mq:
    image: rabbitmq:3.13.6-management-alpine
    container_name: plane-mq
    restart: always
    environment:
      <<: *mq-env
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  plane-minio:
    image: minio/minio:latest
    container_name: plane-minio
    restart: always
    command: server /export --console-address ":9090"
    volumes:
      - uploads:/export
    environment:
      <<: *minio-env
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
    name: plane-pgdata
  redisdata:
    name: plane-redisdata
  uploads:
    name: plane-uploads
  rabbitmq_data:
    name: plane-rabbitmq
  logs_api:
    name: plane-logs-api
  logs_worker:
    name: plane-logs-worker
  logs_beat:
    name: plane-logs-beat
  logs_migrator:
    name: plane-logs-migrator
